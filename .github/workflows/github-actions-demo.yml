name: GitHub Actions Demo

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '14'

      - name: Install dependencies
        run: |
          npm install
          npm ci # Limpia y asegura que se instalen las dependencias correctas

      - name: Run tests
        run: npm test

      - name: Verify Node version
        run: node -v

      - name: Verify npm version
        run: npm -v

      - name: Verify installed packages
        run: npm list